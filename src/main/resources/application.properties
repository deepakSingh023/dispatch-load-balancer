spring.application.name=dispatch-load-balancer

spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?user=REDACTED_USERNAME&password=REDACTED_PASSWORD
spring.datasource.username=REDACTED_USERNAME
spring.datasource.password=REDACTED_PASSWORD


spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1


spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect